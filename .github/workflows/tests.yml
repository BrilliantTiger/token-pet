name: tests

# 게이팅 테스트는 머지 전에 **CI 에서** 초록이어야 한다. 로컬 실행은 기계 상태에
# 휘둘린다 — 실제로 그랬다: 돌고 있던 ClaudePet.app 이 ~/claudepet_debug.log 에 쓰는
# 바람에 격리 검사 51건이 빨갰고, 로컬 빌드를 설치했더니 공증이 깨져 서명 계약 2건이
# 빨갰다. 둘 다 코드와 무관한 실패였다. CI 는 그런 잔여 상태가 없는 기계에서 돈다.
#
# macOS 와 Windows 를 **둘 다** 돌린다. 이 저장소의 원칙은 맥에서 되는 것은 윈도우에서도
# 똑같이 돼야 한다는 것이고, 그 원칙은 테스트 커버리지에도 적용된다.
#
# main 에 push 될 때도 돌린다. dev→main 머지 커밋은 main 에만 생기므로, main 이 빠져
# 있으면 그 커밋에는 push CI 결과가 없어 CI 게이트가 머지를 막는다.

# 잡이 다섯이다(TOK-62 — 1.2.0 이 CI 를 통과하고 실기기에서 바로 터진 뒤):
#   macos / windows                 호스트 러너의 단위 테스트 + 제공자×상태 시나리오 표.
#   macos-bundle / windows-bundle   **배포하는 번들**을 실제로 만들어(서명 없이) 그 번들에게 묻는다.
#                                   소스로만 돌면 번들에만 있는 결함을 못 본다(py2app 의 SSL_CERT_*).
#   real-macos / real-windows       self-hosted 실기기 — 실제로 깔린 CLI 와 실제 로그인 상태.
#
# 실기기 잡은 **막는 게이트다**(대표님, 2026-11-19: "막히지 않으면 뭐 어쩔건데? 어디서 검증하게?").
# 같은 저장소의 PR, main·dev push, 태그, workflow_dispatch 에서 돌고, 실패하면 머지·게시를 막는다.
# 러너가 내려가 있으면 잡은 대기하다 실패한다 — 그것도 막는 것이 맞다: 실기기에서 확인하지 못한 것을
# 내보내지 않는다. 1.2.1 부터 게시는 main 의 실기기 잡 두 개가 초록일 때만 한다.
# **포크의 PR 에서는 돌지 않는다** — 공개 저장소라, 포크의 코드가 대표님 PC 에서 돌게 된다. 포크는
# 워크플로 파일도 고칠 수 있으므로 이 조건만으로는 부족하고, 저장소 설정(외부 기여자의 워크플로는 전부
# 승인 필요)이 함께 막는다. 등록 절차는 ci/SELF_HOSTED_RUNNERS.md.
on:
  push:
    branches: ["claude/**", "dev", "main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS — full suite
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # 코어 자체는 stdlib 만으로 임포트되지만, GUI 를 건드리는 모듈(test_companion_motion
      # 등)은 AppKit 을 실제로 임포트한다. setup.py 의 py2app includes 와 같은 목록이다.
      - name: Install PyObjC
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyobjc-framework-Cocoa pyobjc-framework-Quartz pyobjc-framework-ServiceManagement
      - name: Show environment
        run: |
          python3 -VV
          sw_vers
      # 전체 스위트를 저장소 루트에서 돌린다. tests/ 에는 __init__.py 가 없고
      # 그게 의도된 상태라, `-s tests` 가 cwd 를 sys.path 에 넣어 주는 것에 기댄다.
      # (CLAUDE.md 의 "Run it from the repository root" 참조. __init__.py 를 만들지 말 것.)
      - name: Run full suite
        run: python3 -m unittest discover -s tests -v

  windows:
    name: Windows — gating contract
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # 코어(claude_pet.py)는 fcntl 과 ctypes.CDLL(None) 때문에 윈도우에서 그대로는
      # 임포트되지 않고, 그 우회로의 유일한 소유자는 포트의 windows/win_core.py 다.
      # 예전에는 포트가 `windows` 브랜치에만 있어 그 디렉터리를 거기서 가져왔지만, 지금은
      # dev 가 포트를 직접 담고 있고 `windows` 브랜치는 그보다 오래됐다. 그 단계가 남아
      # 있으면 이 브랜치의 windows/ 를 옛 판으로 덮어써 윈도우 검사가 실제 포트를 보지
      # 못한다(2026-10-05 발견). 그래서 체크아웃한 그대로 쓴다.
      - name: Show environment
        run: |
          python -VV
          systeminfo | findstr /B /C:"OS Name" /C:"OS Version"
        shell: cmd
      # 윈도우에서는 맥 전용 모듈(서명·launchctl·seeding 등)이 아니라 이 기능의
      # 게이팅 계약만 돌린다.
      #
      # `-t .` 를 주면 안 된다 — tests/ 에 __init__.py 가 없는 것이 의도된 상태라
      # unittest 가 그걸 패키지로 취급하려다 "Start directory is not importable" 로
      # 죽는다. CLAUDE.md 의 known issue 목록에 이 에러가 그대로 적혀 있는데 실제로
      # 한 번 밟았다. windows.win_core 는 테스트 파일이 저장소 루트를 sys.path 에
      # 넣으므로 그것 없이도 임포트된다.
      # 게이팅 파일이 늘면 단계를 하나 더한다. discover 는 패턴을 하나만 받고,
      # 한 줄에 몰아넣으면 앞 명령의 실패가 묻힐 수 있어 단계를 나눈다.
      - name: Run gating contract — token recovery
        run: python -m unittest discover -s tests -v -p "test_token_recovery.py"
      - name: Run gating contract — codex usage
        run: python -m unittest discover -s tests -v -p "test_codex_usage.py"
      - name: Run gating contract — server-only usage
        run: python -m unittest discover -s tests -v -p "test_server_only_usage.py"
      # Windows 의 Gemini(agy) 읽기 — 찾기 순서·자격 증명 프로브·가짜 rundll32·taskkill. 맥에서는
      # sys.platform 을 바꿔 돌 뿐이라, 진짜 Windows 에서 갈리는 곳은 여기 하나다.
      - name: Run gating contract — Gemini on Windows
        run: python -m unittest discover -s tests -v -p "test_gemini_windows.py"
      # TOK-61 — 로그인돼 있는 Gemini 에 [로그인] 을 띄우지 않는다, 번들이 넣은 SSL_CERT_FILE·SSL_CERT_DIR 을
      # 자식에게 물려주지 않는다. 1.2.0 이 이 둘을 놓쳤다(소스로 돌리면 그 변수가 없어 CI 에 안 보였다).
      - name: Run gating contract — Gemini sign-in check
        run: python -m unittest discover -s tests -v -p "test_gemini_login_check.py"
      # 이름은 Token Pet 으로 보이되, 1.2.0 업데이터가 찾는 자산 이름·zip 구조·설치 위치는 그대로인가
      # (TOK-59). 앱을 임포트하지 않고 소스만 읽으므로 맥과 같은 검사가 여기서도 돈다.
      - name: Run gating contract — Token Pet name and the 1.2.0 update path
        run: python -m unittest discover -s tests -v -p "test_token_pet_rename.py"
      # 제공자 × 상태 × 동작 시나리오 표(TOK-62). 가짜 CLI 를 진짜 프로세스로 띄우고 로그인 창의
      # PowerShell 스크립트를 실제로 돌린다 — 맥에서 sys.platform 만 바꿔서는 볼 수 없는 쪽이다.
      - name: Run gating contract — CLI state matrix
        run: python -m unittest discover -s tests -v -p "test_cli_state_matrix.py"
      # 포트 자신의 스위트는 **진짜 윈도우에서 통과하지 않는다** — 이 CI 가 처음
      # 드러냈다(run 35452309458):
      #   ModuleNotFoundError: No module named 'fcntl'  (test_win_autostart, test_win_update)
      #   FAIL: windows/compat was put on sys.path on a non-Windows host
      # win_core.py 독스트링은 "윈도우 스위트를 맥에서 돌려도 의미가 있다"고 적고
      # 있는데, 그 반대 방향(진짜 윈도우)은 아무도 돌려 본 적이 없었다. 이 저장소와
      # 무관한 기능 브랜치를 이 기존 결함이 막게 둘 수는 없으므로 실패해도 진행하되,
      # **숨기지는 않는다** — 로그에 그대로 남고 잡은 노란색으로 보고된다.
      # 포트 소유자가 고치면 이 줄을 지운다.
      - name: Run the port's own suite (known-failing on real Windows)
        continue-on-error: true
        run: python -m unittest discover -s windows/tests -t . -v

  # ── 배포하는 번들로 시험한다 ──────────────────────────────────────────────────────────
  macos-bundle:
    name: macOS — built .app (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # 릴리스와 같은 파이썬: python.org universal2. release.sh 는 그 자리(UPY)를 기본으로 쓰고,
      # 배포 타깃이 macOS 12 를 넘는 인터프리터는 거절한다(check_build_python).
      - name: Install python.org universal2 Python
        run: |
          curl -fsSL -o "$RUNNER_TEMP/python.pkg" https://www.python.org/ftp/python/3.13.7/python-3.13.7-macos11.pkg
          sudo installer -pkg "$RUNNER_TEMP/python.pkg" -target /
          /Library/Frameworks/Python.framework/Versions/Current/bin/python3 -VV
      - name: Install build dependencies
        run: |
          PY=/Library/Frameworks/Python.framework/Versions/Current/bin/python3
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install py2app==0.28.10 certifi pyobjc-core pyobjc-framework-Cocoa pyobjc-framework-Quartz pyobjc-framework-ServiceManagement
      # 서명·공증 없는 빌드만이다(release.sh build). sign/notarize/publish 는 여기서 부르지 않는다.
      - name: Build the app bundle (unsigned)
        run: ./release.sh build
      - name: Show py2app log on failure
        if: failure()
        run: tail -60 /tmp/py2app.log || true
      # 번들 자신에게 "CLI 에 넘기는 환경"을 묻는다: SSL_CERT_FILE·SSL_CERT_DIR 이 남지 않고,
      # 그 환경으로 curl https://www.google.com 이 성공해야 한다 — 로그인 창 스크립트 안에서도.
      - name: Bundle hands a clean environment to the CLIs
        run: python3 ci/bundle_cli_env_check.py dist/ClaudePet.app/Contents/MacOS/ClaudePet

  windows-bundle:
    name: Windows — built exe (unsigned)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build dependencies
        run: python -m pip install -r windows/requirements.txt
      # 배포물과 같은 PyInstaller onedir 빌드(build_win.build). zip·설치 파일·서명은 만들지 않는다 —
      # 여기서 보는 것은 실행 폴더의 exe 다.
      - name: Build the app folder (unsigned)
        run: python -c "import os, sys; sys.path.insert(0, 'windows'); import build_win, win_update; build_win.build(); d = os.path.join(build_win.DIST, win_update.APP_DIR_NAME); build_win.write_release_marker(d, build_win.app_version()); build_win.verify(d)"
      - name: Bundle hands a clean environment to the CLIs
        run: python ci/bundle_cli_env_check.py dist-win\ClaudePet\ClaudePet.exe

  # ── 실기기 ───────────────────────────────────────────────────────────────────────────
  real-macos:
    name: Real Mac — installed CLIs, real sign-in
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' ||
                                       startsWith(github.ref, 'refs/tags/')))
    runs-on: [self-hosted, macOS]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # 러너의 파이썬을 그대로 쓴다(setup-python 은 러너에 툴캐시를 깐다). 코어는 stdlib 만으로 뜬다.
      - name: Installed CLIs and sign-in state
        run: python3 ci/real_machine_check.py

  real-windows:
    name: Real Windows — installed CLIs, real sign-in
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' ||
                                       startsWith(github.ref, 'refs/tags/')))
    runs-on: [self-hosted, Windows]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Installed CLIs and sign-in state
        run: python ci/real_machine_check.py
